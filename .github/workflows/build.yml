name: Build

on:
  push:
    branches-ignore: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every old URL must exist with the same title; post bodies must match the baseline.
      - run: npm run verify
